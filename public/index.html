<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1423fb">
<title>Викторины</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Nunito+Sans:wght@500;800;900&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  main { max-width: 960px; margin: 0 auto; padding: 48px 16px; display: flex; flex-direction: column; gap: 32px; }
  h1.display { font-size: clamp(56px, 10vw, 120px); }
  .list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; }
  @media (max-width: 640px) { .list { grid-template-columns: minmax(0, 1fr); } }
  .quiz { display: flex; flex-direction: column; gap: 16px; padding: 28px; color: var(--blue-900); }
  .quiz:nth-child(1) { background: var(--yellow-500); }
  .quiz:nth-child(2) { background: var(--green-500); }
  .quiz h2 { font-size: 44px; }
  .quiz a { color: var(--blue-900); font-weight: 800; font-size: 18px; }
  .quiz a.btn { background: var(--blue-500); color: var(--white); text-decoration: none; align-self: flex-start; }
  .quiz a.btn:hover { background: var(--blue-700); }
</style>
</head>
<body>
<main>
  <h1 class="display">Викторины</h1>
  <div class="list">
    <section class="quiz">
      <h2 class="display">Финансовая викторина</h2>
      <a class="btn" href="/finance">Играть</a>
      <a href="/finance/host">Экран ведущего</a>
    </section>
    <section class="quiz">
      <h2 class="display">Викторина РУДН</h2>
      <a class="btn" href="/rudn">Играть</a>
      <a href="/rudn/host">Экран ведущего</a>
    </section>
  </div>
</main>
</body>
</html>
